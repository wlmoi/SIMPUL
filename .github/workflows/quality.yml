name: SIMPUL quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: JS and Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install backend contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt pytest httpx
      - name: Verify frontend modules and standalone output
        run: npm run verify
      - name: Verify backend API and schema contracts
        run: python -m pytest -q tests
      - name: Check new frontend render entrypoints
        run: |
          node tests/test_classification_render.mjs
          node tests/test_publicintel_render.mjs

# Notes: this CI does NOT claim live provider, SUMO, Docker, field or WCAG validation.
